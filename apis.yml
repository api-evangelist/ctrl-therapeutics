name: CTRL Therapeutics
description: >-
  CTRL Therapeutics (cTRL Tx) is a Chicago-based preclinical biotechnology company developing
  next-generation cell therapies for solid tumors. The company harnesses circulating tumor-reactive
  lymphocytes (cTRLs) - a rare, potent T cell population found in the blood and naturally equipped to
  fight cancer - to engineer polyclonal cell therapies that avoid invasive tumor-tissue surgery. From a
  single blood draw, CTRL's proprietary IsoQore cell-sorting platform isolates millions of migratory,
  tumor-reactive cTRLs via novel markers, aiming to simplify the discovery, manufacturing and
  administration of solid-tumor cell therapy. CTRL launched in 2023 with a $10M seed financing led by
  General Catalyst, with participation from Intermountain Health and FACIT. This profile was surfaced
  as a General Catalyst portfolio company and added to the API Evangelist network; the company operates
  a corporate website and publishes no public developer API surface.
